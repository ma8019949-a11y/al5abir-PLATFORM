  .role-pill.parent { background: var(--warning-bg); color: var(--warning); }
  
  .add-lesson-box { background: var(--bg-card); border: 2px dashed var(--border-color); border-radius: var(--radius-lg); padding: 24px; margin-bottom: 24px; }
  .btn-danger-sm { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--danger); background: var(--danger-bg); color: #F87171; font-size: 13px; font-weight: 700; cursor: pointer; }
  .btn-gold-sm { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--primary); background: var(--primary-glow); color: var(--primary); font-size: 13px; font-weight: 700; cursor: pointer; }

/* منصة الخبير — تسجيل الدخول عبر Supabase */
async function signInWithSupabase(identifier, password) {
  const login = identifier.trim();

  if (!login || !password) {
    throw new Error("اكتب بيانات تسجيل الدخول كاملة.");
  }

  // تعديل تلقائي: إذا أدخل المستخدم رقم هاتف، نحوله لصيغة الإيميل المعتمدة بالمنصة
  const emailLogin = login.includes("@") ? login : `${login}@alkhabeer.edu`;

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email: emailLogin,
    password: password
  });

  if (error) {
    throw new Error("تعذر تسجيل الدخول: " + error.message);
  }

  const { data: profile, error: profileError } = await supabaseClient
    .from("profiles")
    .select("id, full_name, role")
    .eq("id", data.user.id)
    .single();

  if (profileError) {
    await supabaseClient.auth.signOut();
    throw new Error("تعذر تحميل ملف المستخدم. راجع إعدادات قاعدة البيانات.");
  }

  return {
    user: data.user,
    profile: profile
  };
}

/* استعادة جلسة المستخدم عند فتح المنصة */

async function getSupabaseSession() {
  const { data, error } =
    await supabaseClient.auth.getSession();

  if (error) {
    throw new Error("تعذر استعادة جلسة تسجيل الدخول.");
  }

  return data.session;
}

/* تسجيل الخروج */

async function signOutFromSupabase() {
  const { error } = await supabaseClient.auth.signOut();

  if (error) {
    throw new Error("تعذر تسجيل الخروج.");

}

const GRADES = [
  "الصف الأول الإعدادي", 
  "الصف الثاني الإعدادي", 
  "الصف الثالث الإعدادي",
  "الصف الأول الثانوي",
  "الصف الثاني الثانوي",
  "الصف الثالث الثانوي"
];

let state = {
  loading: true,
  currentUser: null,
  view: 'landing',
  authMode: 'login',
  authRole: 'student',
  topTab: 'student',
  teacherExists: false,
  errorMsg: '',
  successMsg: '',
  activeLessonId: null,
  dashTab: 'users',
  theme: 'dark',
  showHistoryDrawer: false,
  newLesson: { title: '', grade: GRADES[0], videoFileUrl: '', codesCount: 100, examUrl: '' },
  usersDb: {},
  lessonsDb: [],
  unlocksDb: {},
  viewsDb: {},
  historyDb: {},
  examsDb: {}, 
  notesDb: {}, 
  blockedDb: {} 
};

let studentsLoaded = false;

async function render() {
  document.getElementById('app').innerHTML = App();

  if (
    state.currentUser?.role === 'teacher' &&
    !studentsLoaded
  ) {
    studentsLoaded = true;

    try {
      await loadStudentsFromSupabase();
      document.getElementById('app').innerHTML = App();
    } catch (error) {
      studentsLoaded = false;
      console.error('خطأ تحميل الطلاب:', error);
    }
  }
}


function esc(s) { return (s || '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const STORAGE_PREFIX = "alkhabeer-platform:";

async function safeGet(key, shared) {
  try {
    const value = localStorage.getItem(STORAGE_PREFIX + key);
    return value;
  } catch (error) {
    console.error("خطأ في قراءة البيانات:", error);
    return null;
  }
}

async function safeSet(key, value, shared) {
  try {
    localStorage.setItem(STORAGE_PREFIX + key, value);
    return true;
  } catch (error) {
    console.error("خطأ في حفظ البيانات:", error);
    alert("تعذر حفظ البيانات على هذا الجهاز.");
    return null;
  }
}
async function loadAll() {
  state.loading = true; render();
  const [teacherRaw, usersRaw, lessonsRaw, unlocksRaw, viewsRaw, historyRaw, examsRaw, notesRaw, blockedRaw] = await Promise.all([
    safeGet('teacher-account', true),
    safeGet('users-db', true),
    safeGet('lessons-db', true),
    safeGet('unlocks-db', true),
    safeGet('views-db', true),
    safeGet('history-db', true),
    safeGet('exams-db', true),
    safeGet('notes-db', true),
    safeGet('blocked-db', true)
  ]);
  // جعل الدالة خاريجية لتجلب البيانات دائماً من Supabase
async function loadStudentsFromSupabase() {
  const { data, error } = await supabaseClient
    .from('profiles')
    .select('id, full_name, role, phone, grade, parent_phone, child_name, child_grade')
    .in('role', ['student', 'parent']);

  if (error) {
    console.error('خطأ Supabase:', error);
    return;
  }

  state.usersDb = {};

  for (const p of data) {
    if (!p.phone) continue;

    state.usersDb[p.phone] = {
      id: p.id,
      phone: p.phone,
      name: p.full_name,
      role: p.role,
      grade: p.grade,
      parentPhone: p.parent_phone,
      childName: p.child_name,
      childGrade: p.child_grade
    };
  }
}

// ثم في دالة loadAll استدعها مباشرة قبل render():
async function loadAll() {
  state.loading = true; 
  render();

  // جلب الطلاب دائماً فور فتح الصفحة لضمان المزامنة بين جميع الأجهزة
  await loadStudentsFromSupabase();

  const [teacherRaw, usersRaw, lessonsRaw, unlocksRaw, viewsRaw, historyRaw, examsRaw, notesRaw, blockedRaw] = await Promise.all([
    safeGet('teacher-account', true),
    safeGet('users-db', true),
    safeGet('lessons-db', true),
    safeGet('unlocks-db', true),
    safeGet('views-db', true),
    safeGet('history-db', true),
    safeGet('exams-db', true),
    safeGet('notes-db', true),
    safeGet('blocked-db', true)
  ]);
  
  state.teacherExists = !!teacherRaw;
  state.teacherAccount = teacherRaw ? JSON.parse(teacherRaw) : null;
  state.lessonsDb = lessonsRaw ? JSON.parse(lessonsRaw) : [];
  state.unlocksDb = unlocksRaw ? JSON.parse(unlocksRaw) : {};
  state.viewsDb = viewsRaw ? JSON.parse(viewsRaw) : {};
  state.historyDb = historyRaw ? JSON.parse(historyRaw) : {};
  state.examsDb = examsRaw ? JSON.parse(examsRaw) : {};
  state.notesDb = notesRaw ? JSON.parse(notesRaw) : {};
  state.blockedDb = blockedRaw ? JSON.parse(blockedRaw) : {};

  state.loading = false;
  render();
}

async function persistUnlocks() { await safeSet('unlocks-db', JSON.stringify(state.unlocksDb), true); }
async function persistViews() { await safeSet('views-db', JSON.stringify(state.viewsDb), true); }
async function persistHistory() { await safeSet('history-db', JSON.stringify(state.historyDb), true); }
async function persistExams() { await safeSet('exams-db', JSON.stringify(state.examsDb), true); }
async function persistNotes() { await safeSet('notes-db', JSON.stringify(state.notesDb), true); }
async function persistBlocked() { await safeSet('blocked-db', JSON.stringify(state.blockedDb), true); }

function generateCustomCodes(count) {
  const codes = {};
  while(Object.keys(codes).length < count) {
    let code = Math.floor(100000 + Math.random() * 900000).toString();
    // القيمة تكون false بمعنى أن الكود غير مستخدم بعد
    codes[code] = false;
  }
  return codes;
}

function toggleTheme() {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', state.theme);
  render();
}

function TopBar() {
  const u = state.currentUser;
  return `
  <div class="topbar">
    <div class="brand-wrap">
      <div class="brand-logo">خ</div>
      <div>
        <div class="brand-title">منصة الخبير</div>
        <div class="brand-subtitle">الأستاذ عبد المنعم رجب • اللغة العربية</div>
      </div>
    </div>
    <div class="top-actions">
      ${u && u.role === 'student' ? `
        <button class="history-btn" onclick="toggleHistoryDrawer(true)">☰ سجل المشاهدة</button>
      ` : ''}
      <button class="btn-icon" onclick="toggleTheme()" title="تغيير السمة">${state.theme === 'dark' ? '☀️' : '🌙'}</button>
      ${u ? `
        <div class="user-badge">${u.role==='teacher' ? '👨‍🏫' : (u.role==='student'?'🎓':'👪')} <b>${esc(u.name)}</b></div>
        <button class="btn-ghost" onclick="logout()">تسجيل خروج</button>
      ` : ''}
    </div>
  </div>`;
}

function App() {
  if (state.loading) {
    return TopBar() + `<div class="container"><div class="empty-state">جاري تحميل المنصة... ⚡</div></div>`;
  }
  let body = '';
  if (!state.currentUser) body = LandingView();
  else if (state.currentUser.role === 'teacher') body = TeacherDashboard();
  else {
    const studentPhone = state.currentUser.role === 'parent' ? getStudentPhoneByParent(state.currentUser) : state.currentUser.phone;
    if (state.blockedDb[studentPhone]) {
      body = `
        <div class="blocked-screen">
          <h2>🚫 تم حظر حسابك مؤقتاً من المنصة</h2>
          <p style="color:var(--text-main); font-size:16px;">يرجى التواصل مع الأستاذ عبد المنعم رجب لمعرفة السبب وفك الحظر.</p>
        </div>`;
    } else if (state.currentUser.role === 'parent') {
      body = ParentDashboard();
    } else if (state.view === 'video') {
      body = VideoView();
    } else if (state.view === 'exam') {
      body = ExamView();
    } else {
      body = StudentHome();
    }
  }

  return TopBar() + `<div class="container">${body}</div>` + 
         (state.activeLessonId !== null && state.view !== 'video' && state.view !== 'exam' ? CodeModal() : '') +
         (state.showHistoryDrawer ? HistoryDrawer() : '');
}

function getStudentPhoneByParent(parentUser) {
  for(let p in state.usersDb) {
    let u = state.usersDb[p];
    if(u.role === 'student' && (u.parentPhone === parentUser.phone || u.name === parentUser.childName)) {
      return p;
    }
  }
  return parentUser.phone; 
}

function LandingView() {
  return `
  <div class="hero-section">
    <h1>مع الخبير العربي اسهل بكتير</h1>
    <p>سجّل دخولك أو أنشئ حساب جديد للوصول لدروس الأستاذ عبد المنعم رجب</p>
  </div>
  <div class="auth-card">
    <div class="tabs-group">
      <button class="tab-btn ${state.topTab==='student'?'active':''}" onclick="setTopTab('student')">طالب / ولي أمر</button>
      <button class="tab-btn ${state.topTab==='teacher'?'active':''}" onclick="setTopTab('teacher')">المستر</button>
    </div>
    ${state.topTab==='student' ? StudentAuthArea() : TeacherAuthArea()}
  </div>`;
}

function StudentAuthArea() {
  const isLogin = state.authMode === 'login';

    <div class="subtabs-group">

    </div>

        <div class="input-group"><label>رقم الموبايل</label><input required id="f_phone" type="tel" placeholder="01xxxxxxxxx"></div>

function TeacherAuthArea() {
  const setup = !state.teacherExists;
  return `
    ${state.errorMsg ? `<div class="alert-box error">${esc(state.errorMsg)}</div>` : ''}
    ${setup ? `<div class="alert-box success">أنشئ حساب المستر الأول ليتم حفظه بأمان.</div>` : ''}

function StudentHome() {
  const u = state.currentUser;
  const grade = u.grade;
  const lessons = state.lessonsDb.filter(l => l.grade === grade).sort((a,b)=> (a.order||0)-(b.order||0));
  const unlocks = state.unlocksDb[u.phone] || [];
  
  return `
    <div class="section-header">
      <h2>دروس ${esc(grade)}</h2>
      <span>امتحن أولاً (لو وجد) ثم أدخل الكود لفتح وحفظ الدرس</span>
    </div>
    ${lessons.length===0 ? `<div class="empty-state">لا توجد دروس متاحة لهذا الصف حالياً.</div>` : `
    <div class="lessons-grid">
      ${lessons.map((l,i)=>{
        const unlocked = unlocks.includes(l.id);
        const hasExam = !!l.examUrl;
        const examData = (state.examsDb[u.phone] && state.examsDb[u.phone][l.id]) || null;
        const examDone = !hasExam || (examData && examData.submitted);

        let actionBtnText = '🔒 إدخال كود التفعيل';
        let actionClass = '';
        let actionClick = `openCodeModal('${l.id}')`;

        if(unlocked) {
          actionBtnText = '▶ مشاهدة الدرس الآن';
          actionClass = 'unlocked';
          actionClick = `openVideo('${l.id}')`;
        } else if(!examDone) {
          actionBtnText = '📝 ادخل الامتحان المطلوب أولاً';
          actionClass = 'exam-required';
          actionClick = `openExam('${l.id}')`;
        }

        return `
        <div class="lesson-card">
          <div class="lesson-badge-num">${i+1}</div>
          <h3>${esc(l.title)}</h3>
          <div class="lesson-grade">${esc(l.grade)}</div>
          <div class="lesson-status">
            <span class="status-dot ${unlocked?'unlocked':''}"></span>
            ${unlocked ? 'الدرس متاح للمشاهدة' : (hasExam && !examDone ? 'مطلوب حل امتحان الجوجل فورم أولاً' : 'جاهز لإدخال كود التفعيل')}
          </div>
          <button class="btn-lesson-action ${actionClass}" onclick="${actionClick}">
            ${actionBtnText}
          </button>
        </div>`;
      }).join('')}
    </div>`}
  `;
}

function ParentDashboard() {
  const pUser = state.currentUser;
  const studentPhone = getStudentPhoneByParent(pUser);
  const student = state.usersDb[studentPhone] || { name: pUser.childName, grade: pUser.childGrade, phone: 'غير مرتبط برقم صحيح بعد' };
  const lessons = state.lessonsDb.filter(l => l.grade === student.grade).sort((a,b)=> (a.order||0)-(b.order||0));
  const unlocks = state.unlocksDb[studentPhone] || [];
  const views = state.viewsDb[studentPhone] || {};
  const exams = state.examsDb[studentPhone] || {};
  const note = state.notesDb[studentPhone] || 'لا توجد ملاحظات حالياً من المستر.';

  return `
    <div class="section-header">
      <h2>👨‍‍👩‍👦 جدول متابعة الطالب: ${esc(student.name)}</h2>
      <span>الصف: ${esc(student.grade)}</span>
    </div>

    <div style="background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--radius-lg); padding:20px; margin-bottom:24px; box-shadow:var(--shadow-subtle);">
      <h3 style="font-size:16px; margin-bottom:8px; color:var(--primary);">📌 ملاحظات الأستاذ عبد المنعم رجب على الطالب:</h3>
      <p style="color:var(--text-main); font-size:15px; font-weight:600;">${esc(note)}</p>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>عنوان الدرس</th>
            <th>حالة فتح الحصة</th>
            <th>وقت فتح المشاهدة</th>
            <th>درجة امتحان جوجل فورم</th>
          </tr>
        </thead>
        <tbody>
          ${lessons.length === 0 ? `<tr><td colspan="5" class="empty-state">لا توجد دروس حالياً.</td></tr>` : lessons.map((l, idx) => {
            const isUnlocked = unlocks.includes(l.id);
            const watchTime = views[l.id] || 'لم يشاهد بعد';
            const examInfo = exams[l.id];
            return `
              <tr>
                <td><b>${idx+1}</b></td>
                <td><b>${esc(l.title)}</b></td>
                <td>
                  <span class="role-pill ${isUnlocked ? 'student' : 'parent'}" style="background:${isUnlocked ? 'var(--success-bg)' : 'var(--danger-bg)'}; color:${isUnlocked ? 'var(--success)' : 'var(--danger)'}">
                    ${isUnlocked ? '✅ فتح الحصة' : '🔒 لم تفتح بعد'}
                  </span>
                </td>
                <td style="color:var(--text-muted);">${esc(watchTime)}</td>
                <td>
                  ${examInfo ? `<code class="code-kbd">${esc(examInfo.score)}</code>` : (l.examUrl ? '<span style="color:var(--warning)">لم يمتحن بعد</span>' : '<span style="color:var(--text-muted)">لا يوجد امتحان</span>')}
                </td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function ExamView() {
  const lesson = state.lessonsDb.find(l => l.id === state.activeLessonId);
  if(!lesson) return `<div class="empty-state">الدرس غير موجود</div>`;

  return `
    <button class="btn-back" onclick="backToHome()">← العودة لقائمة الدروس</button>
    <div class="video-container" style="text-align:center;">
      <h2>📝 امتحان الدرس: ${esc(lesson.title)}</h2>
      <p style="color:var(--text-muted); margin-bottom:16px;">يرجى حل الامتحان أدناه على نموذج جوجل فورم، ثم تسجيل درجتك لتتمكن من فتح الحصة.</p>
      
      <div style="background:var(--bg-main); border:1px solid var(--border-color); border-radius:var(--radius-md); padding:20px; margin-bottom:20px;">
        <iframe src="${esc(lesson.examUrl)}" width="100%" height="450px" style="border:none; border-radius:8px;">جاري تحميل الامتحان...</iframe>
      </div>

      <div style="max-width:400px; margin:0 auto; background:var(--bg-main); padding:20px; border-radius:var(--radius-md); border:1px solid var(--border-color);">
        <h3 style="font-size:16px; margin-bottom:10px;">أدخل درجتك التي حصلت عليها في النموذج (مثلاً: 10/10 أو 8/10):</h3>
        <div class="input-group"><input id="exam_score_input" placeholder="مثال: 10/10"></div>
        <button class="btn-primary" onclick="submitExamScore('${lesson.id}')">تأكيد وإرسال الدرجة للمستر</button>
      </div>
    </div>
  `;
}

async function submitExamScore(lessonId) {
  const score = document.getElementById('exam_score_input').value.trim();
  if(!score) { alert('أدخل الدرجة أولاً!'); return; }
  
  const u = state.currentUser;
  if(!state.examsDb[u.phone]) state.examsDb[u.phone] = {};
  state.examsDb[u.phone][lessonId] = { score, submitted: true };
  await persistExams();
  
  alert('تم تسجيل درجتك بنجاح! يمكنك الآن إدخال كود التفعيل لفتح الدرس.');
  backToHome();
}

function HistoryDrawer() {
  const u = state.currentUser;
  const history = (state.historyDb[u.phone] || []).slice().reverse();
  return `
  <div class="history-drawer-overlay" onclick="if(event.target===this) toggleHistoryDrawer(false)">
    <div class="history-drawer">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h3 style="font-size:18px; font-weight:900;">📜 سجل الفيديوهات المشاهدة</h3>
        <button class="btn-ghost" onclick="toggleHistoryDrawer(false)">✕ إغلاق</button>
      </div>
      <div style="flex:1; overflow-y:auto;">
        ${history.length === 0 ? `<div class="empty-state">لم تقم بمشاهدة أي درس حتى الآن.</div>` : history.map(h => `
          <div class="history-item">
            <div class="history-item-title">${esc(h.title)}</div>
            <div class="history-item-time">🕒 ${esc(h.time)}</div>
          </div>
        `).join('')}
      </div>
    </div>
  </div>`;
}

function CodeModal() {

  return `
  <div class="modal-overlay" onclick="if(event.target===this) closeCodeModal()">
    <div class="modal-box">
      <h3>${esc(lesson.title)}</h3>
      <p>أدخل كود التفعيل (أرقام) لفتح هذا الدرس</p>
      ${state.codeError ? `<div class="alert-box error">${esc(state.codeError)}</div>` : ''}

      <div style="display:flex; gap:10px; margin-top:20px;">
        <button class="btn-ghost" style="flex:1" onclick="closeCodeModal()">إلغاء</button>
        <button class="btn-primary" style="flex:1; margin-top:0" onclick="submitCode()">تحقق وفتح</button>
      </div>
    </div>

}

function VideoView() {

  return `
    <button class="btn-back" onclick="backToHome()">← العودة لقائمة الدروس</button>
    <div class="video-container">
      <h2 style="margin-top:0">${esc(lesson.title)}</h2>
  
<div class="video-responsive">
    <iframe
        src="${esc(lesson.videoUrl).replace('/view?usp=sharing', '/preview').replace('/view', '/preview')}"
        width="100%"
        height="450"
        style="border:0; border-radius:12px;"
        allow="autoplay; fullscreen"
        allowfullscreen>
    </iframe>
</div>
    </div>
  `;

function TeacherDashboard() {
  return `
    <div class="dashboard-tabs">
      <button class="dashboard-tab-btn ${state.dashTab==='users'?'active':''}" onclick="setDashTab('users')">الطلبة والبلوك والملاحظات (${Object.keys(state.usersDb).length})</button>
      <button class="dashboard-tab-btn ${state.dashTab==='lessons'?'active':''}" onclick="setDashTab('lessons')">الدروس والأكواد (${state.lessonsDb.length})</button>
      <button class="dashboard-tab-btn ${state.dashTab==='views'?'active':''}" onclick="setDashTab('views')">متابعة المشاهدات والامتحانات 👁️</button>
    </div>
    ${state.dashTab==='users' ? UsersTable() : (state.dashTab==='lessons' ? LessonsManager() : ViewsTrackerTable())}
  `;
}

function UsersTable() {
  const list = Object.values(state.usersDb).sort((a,b)=> (a.createdAt||0)-(b.createdAt||0));
  if(list.length===0) return `<div class="empty-state">لا توجد حسابات مسجلة حتى الآن.</div>`;
  return `
  <div class="table-wrapper">
    <table>
      <thead><tr><th>نوع الحساب</th><th>الاسم</th><th>رقم الموبايل</th><th>الصف الدراسي</th><th>الحالة والتحكم بالبلوك</th><th>ملاحظات المستر</th></tr></thead>
      <tbody>
        ${list.map(u=>{
          const isBlocked = !!state.blockedDb[u.phone];
          const noteText = state.notesDb[u.phone] || '';
          return `
          <tr>
            <td><span class="role-pill ${u.role}">${u.role==='student'?'طالب':'ولي أمر'}</span></td>
            <td><b>${esc(u.name)}</b></td>
            <td>${esc(u.phone)}</td>
            <td>${esc(u.role==='student'? u.grade : u.childGrade)}</td>
            <td>
              ${isBlocked ? `
                <span style="color:var(--danger); font-weight:bold; display:block; margin-bottom:6px;">🚫 محظور</span>
                <button class="btn-gold-sm" onclick="toggleBlock('${u.phone}', false)">فك البلوك</button>
              ` : `
                <span style="color:var(--success); font-weight:bold; display:block; margin-bottom:6px;">🟢 متاح</span>
                <button class="btn-danger-sm" onclick="toggleBlock('${u.phone}', true)">حظر الطالب</button>
              `}
            </td>
            <td>
              <div style="display:flex; gap:6px;">
                <input id="note_${u.phone}" value="${esc(noteText)}" placeholder="اكتب ملاحظة..." style="font-size:13px; padding:6px 10px;">
                <button class="btn-gold-sm" onclick="saveStudentNote('${u.phone}')">حفظ</button>
              </div>
            </td>
          </tr>
        `;}).join('')}
      </tbody>
    </table>
  </div>`;
}

async function toggleBlock(phone, blockStatus) {
  state.blockedDb[phone] = blockStatus;
  await persistBlocked();
  render();
}

async function saveStudentNote(phone) {
  const val = document.getElementById('note_' + phone).value.trim();
  state.notesDb[phone] = val;
  await persistNotes();
  alert('تم حفظ ملاحظة المستر بنجاح!');
  render();
}

function ViewsTrackerTable() {
  const viewsList = [];
  Object.keys(state.usersDb).forEach(phone => {
    const user = state.usersDb[phone];
    if(user && user.role === 'student') {
      state.lessonsDb.forEach(lesson => {
        const unlocked = (state.unlocksDb[phone] || []).includes(lesson.id);
        const watched = (state.viewsDb[phone] && state.viewsDb[phone][lesson.id]) || null;
        const exam = (state.examsDb[phone] && state.examsDb[phone][lesson.id]) || null;
        
        viewsList.push({
          studentName: user.name,
          phone: user.phone,
          grade: user.grade,
          lessonTitle: lesson.title,
          unlocked,
          watchedAt: watched || 'لم يشاهد بعد',
          examScore: exam ? exam.score : (lesson.examUrl ? 'لم يمتحن' : 'بدون امتحان')
        });
      });
    }
  });

  if(viewsList.length === 0) return `<div class="empty-state">لا توجد أي بيانات متابعة للطلاب حتى الآن.</div>`;
  return `
  <div class="table-wrapper">
    <table>
      <thead><tr><th>اسم الطالب</th><th>رقم الموبايل</th><th>الدرس</th><th>فتح الحصة؟</th><th>وقت المشاهدة</th><th>درجة امتحان جوجل فورم</th></tr></thead>
      <tbody>
        ${viewsList.map(v => `
          <tr>
            <td><b>${esc(v.studentName)}</b></td>
            <td>${esc(v.phone)}</td>
            <td>${esc(v.lessonTitle)}</td>
            <td>
              <span class="role-pill" style="background:${v.unlocked?'var(--success-bg)':'var(--danger-bg)'}; color:${v.unlocked?'var(--success)':'var(--danger)'}">
                ${v.unlocked ? '✅ متاح' : '🔒 مغلق'}
              </span>
            </td>
            <td style="color:${v.watchedAt !== 'لم يشاهد بعد' ? 'var(--success)' : 'var(--text-muted)'}">${esc(v.watchedAt)}</td>
            <td><code class="code-kbd">${esc(v.examScore)}</code></td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  </div>`;
}

function LessonsManager() {
  const nl = state.newLesson;
  return `
    <div class="add-lesson-box">
      <h3>➕ إضافة درس جديد، رابط امتحان جوجل فورم، وعدد الأكواد الرقمية</h3>
      <div class="row-flex">
        <div class="input-group"><label>عنوان الدرس</label><input id="nl_title" value="${esc(nl.title)}" placeholder="مثلاً: النحو - الفاعل والمفعول به"></div>
        <div class="input-group"><label>الصف الدراسي</label>
          <select id="nl_grade">${GRADES.map(g=>`<option value="${esc(g)}" ${nl.grade===g?'selected':''}>${esc(g)}</option>`).join('')}</select>
        </div>
      </div>
      <div class="row-flex">
        <div class="input-group"><label>عدد الأكواد المطلوبة (أرقام)</label><input type="number" id="nl_count" value="${nl.codesCount}" min="1" max="1000"></div>
        <div class="input-group"><label>رابط امتحان جوجل فورم (اختياري)</label><input id="nl_exam" placeholder="https://forms.gle/xxxxxx"></div>
      </div>
     
<div class="input-group">
  <label for="nl_video_url">رابط فيديو الدرس من Google Drive</label>
  <input
    type="url"
    id="nl_video_url"
    placeholder="الصق رابط Google Drive هنا"
    dir="ltr"
  >
</div>

      <button class="btn-primary" onclick="addLesson()">حفظ ونشر الدرس وتوليد الأكواد الرقمية</button>
    </div>
    ${state.lessonsDb.length===0 ? `<div class="empty-state">لم يتم إضافة دروس بعد.</div>` : state.lessonsDb.map(l=>LessonCodesCard(l)).join('')}
  `;
}

function LessonCodesCard(l) {
  const codes = l.studentCodes || {};
  const codesList = Object.keys(codes);
  return `
    <div class="table-wrapper" style="margin-bottom:20px;">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border-color);flex-wrap:wrap;gap:10px;">
        <div>
          <div style="font-weight:900;font-size:16px;">${esc(l.title)} ${l.examUrl ? '📝 (يحتوي على امتحان)' : ''}</div>
          <div style="color:var(--text-muted);font-size:13px;margin-top:2px;">${esc(l.grade)} • إجمالي الأكواد: ${codesList.length}</div>
        </div>
        <div style="display:flex;gap:10px;">
          <button class="btn-gold-sm" onclick="printLessonCodes('${l.id}')">🖨 طباعة الأكواد الرقمية</button>
          <button class="btn-danger-sm" onclick="deleteLesson('${l.id}')">حذف الدرس</button>
        </div>
      </div>
      <div style="padding:16px 20px; max-height: 150px; overflow-y: auto; display: flex; flex-wrap: wrap; gap: 8px;">
        ${codesList.slice(0, 30).map(c=>{
          const isUsed = codes[c];
          return `<code class="code-kbd" style="border-color:${isUsed ? 'var(--danger)' : 'var(--border-color)'}; opacity:${isUsed ? 0.6 : 1};" title="${isUsed ? 'مستخدم' : 'غير مستخدم'}">${c}${isUsed ? '❌' : ''}</code>`;
        }).join('')}
        ${codesList.length > 30 ? `<span style="color:var(--text-muted);align-self:center;font-size:13px;">... والمزيد</span>` : ''}
      </div>
    </div>`;
}

function printLessonCodes(lessonId) {
  const l = state.lessonsDb.find(item => item.id === lessonId);
  if(!l) return;
  const codes = Object.keys(l.studentCodes || {});
  const win = window.open('', '_blank');
  win.document.write(`
    <html dir="rtl"><head><title>أكواد: ${l.title}</title>
    <style>body{font-family:Arial;padding:20px;} h1{text-align:center;font-size:20px;} .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;} .box{border:1px dashed #333;padding:8px;text-align:center;font-weight:bold;background:#f9f9f9;font-size:16px;letter-spacing:1px;}</style>
    </head><body><h1>أكواد تفعيل منصة الخبير (أرقام) - ${l.title}</h1><div class="grid">${codes.map(c=>`<div class="box">${c}</div>`).join('')}</div>
    <script>window.onload=function(){window.print();window.close();}<\/script></body></html>
  `);
  win.document.close();
}

function setTopTab(tab) { state.topTab = tab; state.errorMsg = ''; state.successMsg = ''; render(); }
function setAuthRole(role) { state.authRole = role; state.errorMsg = ''; state.successMsg = ''; render(); }
function toggleAuthMode() { 
  state.authMode = state.authMode === 'login' ? 'register' : 'login'; 
  state.errorMsg = ''; 
  state.successMsg = ''; 
  render(); 
}
function setDashTab(tab) { state.dashTab = tab; render(); }
function toggleHistoryDrawer(isOpen) { state.showHistoryDrawer = isOpen; render(); }


async function handleTeacherAuthSubmit(event) {
  event.preventDefault();

  const u = document.getElementById('t_user').value.trim();
  const p = document.getElementById('t_pass').value;

  if (!u || !p) {
    state.errorMsg = 'ma8019949@gmail.com';
    render();
    return false;
  }

  try {
    // Supabase password login requires the registered email.
    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email: u,
      password: p
    });

    if (error) throw error;

    const { data: profile, error: profileError } =
      await supabaseClient
        .from('profiles')
        .select('id, full_name, role')
        .eq('id', data.user.id)
        .single();

    if (profileError) throw profileError;

    if (profile.role !== 'teacher') {
      await supabaseClient.auth.signOut();
      throw new Error('الحساب ده مش مسجل كحساب مدرس.');
    }

    state.currentUser = {
      id: data.user.id,
      role: 'teacher',
      name: profile.full_name || 'الأستاذ عبد المنعم رجب'
    };

    state.view = 'teacherDashboard';
    state.errorMsg = '';
    render();

  } catch (error) {
    console.error(error);
    state.errorMsg =
      error.message === 'Invalid login credentials'
        ? 'الإيميل أو كلمة المرور غير صحيحة.'
        : (error.message || 'حصل خطأ أثناء تسجيل الدخول.');
    render();
  }

  return false;
}




async function handleStudentAuthSubmit(e) {
  e.preventDefault();

  state.errorMsg = '';
  state.successMsg = '';

  const isLogin = state.authMode === 'login';
  const phone = document.getElementById('f_phone').value.trim();
  const pass = document.getElementById('f_pass').value;

  if (!phone || !pass) {
    state.errorMsg = 'اكتب رقم الموبايل وكلمة السر';
    render();
    return false;
  }

  // رقم الموبايل هو اسم المستخدم الظاهر للطالب.
  // البريد الداخلي وسيلة دخول فقط، وليس بريدًا حقيقيًا.
  const email = `${phone.replace(/\D/g, '')}@alkhabeer.app`;

  try {
    let authData;

    if (isLogin) {
      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email,
          password: pass
        });

      if (error) throw error;
      authData = data;
    } else {
      const name = document.getElementById('f_name').value.trim();

      let profile = {
        full_name: name,
        phone,
        role: state.authRole
      };

      if (state.authRole === 'student') {
        profile.grade = document.getElementById('f_grade').value;
        profile.parent_phone =
          document.getElementById('f_parentphone').value.trim();
      } else {
        profile.child_name =
          document.getElementById('f_childname').value.trim();
        profile.child_grade =
          document.getElementById('f_childgrade').value;
      }

      const { data, error } = await supabaseClient.auth.signUp({
        email,
        password: pass
      });

      if (error) throw error;
      authData = data;

      if (!authData.session) {
        throw new Error(
          'الحساب اتسجل، لكن مفيش جلسة دخول. راجع إعدادات Auth.'
        );
      }

      const { error: profileError } = await supabaseClient
        .from('profiles')
        .insert({
          id: authData.user.id,
          ...profile
        });

      if (profileError) throw profileError;
    }

    const { data: profileData, error: readError } =
      await supabaseClient
        .from('profiles')
        .select(
          'id, full_name, role, phone, grade, parent_phone, child_name, child_grade'
        )
        .eq('id', authData.user.id)
        .single();

    if (readError) throw readError;

    const p = profileData;

    state.currentUser = {
      id: p.id,
      phone: p.phone || phone,
      name: p.full_name,
      role: p.role,
      grade: p.grade,
      parentPhone: p.parent_phone,
      childName: p.child_name,
      childGrade: p.child_grade
    };

    render();
  } catch (error) {
    console.error(error);
    state.errorMsg = error.message || 'حصل خطأ أثناء التسجيل أو الدخول';
    render();
  }

  return false;
}

async function addLesson() {
  const title = document.getElementById('nl_title').value.trim();
  const grade = document.getElementById('nl_grade').value;
  const count = parseInt(document.getElementById('nl_count').value) || 100;
  const examUrl = document.getElementById('nl_exam').value.trim();

  // قراءة رابط الفيديو من خانة الرابط الجديدة
  const videoInput = document.getElementById('nl_video_url');
  const rawVideoUrl = videoInput ? videoInput.value.trim() : '';

  if (!title || !rawVideoUrl) {
    alert('اكتب عنوان الدرس وحط رابط فيديو Google Drive!');
    return;
  }

  // استخراج معرّف ملف Google Drive وتحويله لرابط عرض
  const match = rawVideoUrl.match(
    /drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/
  );

  if (!match) {
    alert('الرابط غير صحيح. انسخ رابط الفيديو من Google Drive.');
    return;
  }

  const videoUrl = `https://drive.google.com/file/d/${match[1]}/preview`;

  const newId = 'lesson_' + Date.now();

  const lessonObj = {
    id: newId,
    title,
    grade,
    videoUrl,
    examUrl,
    order: state.lessonsDb.length,
    studentCodes: generateCustomCodes(count)
  };

  state.lessonsDb.push(lessonObj);

  try {
    await persistLessons();

    state.newLesson = {
      title: '',
      grade: GRADES[0],
      videoFileUrl: '',
      codesCount: 100,
      examUrl: ''
    };

    if (videoInput) videoInput.value = '';

    alert('تمت إضافة الدرس وحفظ بياناته! 🎉');
    render();
  } catch (error) {
    state.lessonsDb.pop();
    console.error(error);
    alert('حصلت مشكلة أثناء حفظ الدرس. حاول مرة تانية.');
  }
}


async function deleteLesson(id) {
  if(confirm('متأكد من حذف الدرس؟')) {
    state.lessonsDb = state.lessonsDb.filter(l => l.id !== id);
    await persistLessons(); render();
  }
}

function openCodeModal(lessonId) { state.activeLessonId = lessonId; state.codeError = ''; render(); }
function closeCodeModal() { state.activeLessonId = null; state.codeError = ''; render(); }

function openExam(lessonId) {
  state.activeLessonId = lessonId;
  state.view = 'exam';
  render();
}

async function submitCode() {
  const codeVal = document.getElementById('code_input').value.trim();
  const lesson = state.lessonsDb.find(l => l.id === state.activeLessonId);
  
  if(!lesson || !(codeVal in lesson.studentCodes)) {
    state.codeError = 'الكود غير صحيح!'; render(); return;
  }

  // التحقق مما إذا كان الكود قد استخدم مسبقاً
  if(lesson.studentCodes[codeVal] === true) {
    state.codeError = 'هذا الكود تم استخدامه مسبقاً ولا يمكن استخدامه مرة أخرى!'; render(); return;
  }

  // تحديث حالة الكود ليصبح مستخدماً (True) لدرس واحد فقط
  lesson.studentCodes[codeVal] = true;
  await persistLessons();

  const phone = state.currentUser.phone;
  if(!state.unlocksDb[phone]) state.unlocksDb[phone] = [];
  if(!state.unlocksDb[phone].includes(lesson.id)) state.unlocksDb[phone].push(lesson.id);
  await persistUnlocks();
  
  const lid = state.activeLessonId;
  closeCodeModal(); openVideo(lid);
}

async function openVideo(lessonId) {
  state.activeLessonId = lessonId;
  state.view = 'video';
  
  const u = state.currentUser;
  const lesson = state.lessonsDb.find(l => l.id === lessonId);
  if(u && u.role === 'student' && lesson) {
    const timeStr = new Date().toLocaleString('ar-EG');
    
    if(!state.viewsDb[u.phone]) state.viewsDb[u.phone] = {};
    state.viewsDb[u.phone][lessonId] = timeStr;
    await persistViews();

    if(!state.historyDb[u.phone]) state.historyDb[u.phone] = [];
    state.historyDb[u.phone] = state.historyDb[u.phone].filter(h => h.id !== lessonId);
    state.historyDb[u.phone].push({ id: lessonId, title: lesson.title, time: timeStr });
    await persistHistory();
  }
  render();
}

function backToHome() { state.activeLessonId = null; state.view = 'studentHome'; render(); }
function logout() { state.currentUser = null; state.view = 'landing'; state.activeLessonId = null; render(); }

loadAll();
</script>
